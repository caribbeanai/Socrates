[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "socrates-ai"
version = "0.1.0"
description = "Stop agreeing, start reasoning. Reduce AI sycophancy with recursive self-critique, adversarial review, calibration, and evidence verification."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Adrian Dunkley", email = "founder@starapple.ai" }]
keywords = [
    "ai", "llm", "sycophancy", "critique", "socratic", "calibration",
    "fact-checking", "anthropic", "openai", "gemini", "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Core has zero hard runtime dependencies — provider SDKs are optional extras.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
gemini = ["google-generativeai>=0.7"]
all = ["anthropic>=0.40", "openai>=1.40", "google-generativeai>=0.7"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
socrates = "socrates.cli:main"

[project.urls]
Homepage = "https://github.com/caribbeanai/socrates"
Repository = "https://github.com/caribbeanai/socrates"
Issues = "https://github.com/caribbeanai/socrates/issues"
Author = "https://adriandunkley.net"

[tool.hatch.build.targets.wheel]
packages = ["src/socrates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]  # long lines tolerated in prompt templates

[tool.mypy]
python_version = "3.10"
packages = ["socrates"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
